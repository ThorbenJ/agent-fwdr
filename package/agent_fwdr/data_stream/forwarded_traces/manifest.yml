title: Forwarded events — traces write permission
type: traces
dataset: agent_fwdr.forwarded_traces
# This data stream is disabled and receives no traffic directly. Its sole purpose is to grant
# the forwarder agent write access to traces-*-*. The forwarded data stream (type: logs) handles
# all incoming lumberjack connections; the ingest pipeline then reroutes trace events to their
# original traces-* data streams via the reroute processor. Fleet derives API key permissions
# from every data stream in the policy, so including this grants traces-*-* access without
# requiring a second listener.
elasticsearch:
  dynamic_dataset: true
  dynamic_namespace: true
streams:
  - input: lumberjack
    title: Forwarded traces (permission grant)
    description: >-
      Grants the forwarder agent write access to traces-*-* so the ingest pipeline can reroute
      trace events to their original data streams. No listener is started; all traffic arrives
      on the main forwarded input.
    template_path: lumberjack.yml.hbs
